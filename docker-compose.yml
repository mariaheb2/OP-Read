version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: opread-postgres
    environment:
      POSTGRES_DB: opread_db
      POSTGRES_USER: opread_user
      POSTGRES_PASSWORD: opread_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata: